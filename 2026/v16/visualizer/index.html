<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DGT Traffic Incidents API Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', monospace;
      background: #0d1117;
      color: #c9d1d9;
      line-height: 1.6;
      font-size: 14px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      border-bottom: 1px solid #21262d;
      padding: 30px 0 20px;
      margin-bottom: 20px;
    }

    h1 {
      color: #58a6ff;
      font-size: 1.8em;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .repo-meta {
      color: #8b949e;
      font-size: 0.9em;
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge {
      background: #21262d;
      padding: 3px 8px;
      border-radius: 3px;
      font-size: 0.85em;
      border: 1px solid #30363d;
    }

    .api-info {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .api-info h2 {
      color: #58a6ff;
      font-size: 1em;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .api-endpoint {
      background: #0d1117;
      border: 1px solid #30363d;
      padding: 10px;
      border-radius: 6px;
      color: #79c0ff;
      overflow-x: auto;
      margin: 8px 0;
      font-size: 0.85em;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    button {
      background: #238636;
      color: white;
      border: 1px solid #2ea043;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.9em;
      cursor: pointer;
      font-weight: 500;
      font-family: 'Courier New', monospace;
    }

    button:hover {
      background: #2ea043;
    }

    button:disabled {
      background: #21262d;
      border-color: #30363d;
      color: #6e7681;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #21262d;
      border-color: #30363d;
      color: #c9d1d9;
    }

    .btn-secondary:hover {
      background: #30363d;
    }

    input[type="text"] {
      background: #0d1117;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.9em;
      flex: 1;
      min-width: 250px;
      font-family: 'Courier New', monospace;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #58a6ff;
    }

    .stats {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 15px;
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
    }

    .stat-item {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .stat-label {
      color: #8b949e;
    }

    .stat-value {
      color: #58a6ff;
      font-weight: bold;
    }

    .incident {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 12px;
      font-size: 0.9em;
    }

    .incident-header {
      color: #58a6ff;
      font-weight: bold;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid #21262d;
    }

    .incident-line {
      padding: 2px 0;
      display: flex;
    }

    .field-label {
      color: #8b949e;
      min-width: 180px;
      flex-shrink: 0;
    }

    .field-value {
      color: #c9d1d9;
      word-break: break-word;
    }

    .severity-high { color: #f85149; }
    .severity-medium { color: #d29922; }
    .severity-low { color: #3fb950; }

    .map-link {
      color: #58a6ff;
      text-decoration: none;
    }

    .map-link:hover {
      text-decoration: underline;
    }

    .loading {
      text-align: center;
      padding: 40px 20px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid #21262d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error {
      background: #161b22;
      border: 1px solid #da3633;
      border-left: 4px solid #da3633;
      color: #f85149;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 0.9em;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #8b949e;
    }

    footer {
      margin-top: 40px;
      padding: 20px 0;
      border-top: 1px solid #21262d;
      text-align: center;
      color: #8b949e;
      font-size: 0.85em;
    }

    footer a {
      color: #58a6ff;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      h1 { font-size: 1.5em; }
      .field-label { min-width: 150px; }
      .controls { flex-direction: column; }
      input[type="text"] { min-width: 100%; }
      .stats { flex-direction: column; gap: 10px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🚨 DGT TRAFFIC INCIDENTS API</h1>
      <div class="repo-meta">
        <span class="badge">DATEX II v3.6</span>
        <span class="badge">Real-time</span>
        <span class="badge">XML Parser</span>
      </div>
    </header>

    <div class="api-info">
      <h2>API Endpoint</h2>
      <div class="api-endpoint">
        GET https://nap.dgt.es/datex2/v3/dgt/SituationPublication/datex2_v36.xml
      </div>
    </div>

    <div id="stats" style="display: none;" class="stats">
      <div class="stat-item">
        <span class="stat-label">Total:</span>
        <span class="stat-value" id="totalIncidents">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">High Severity:</span>
        <span class="stat-value" id="highSeverity">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Last Fetch:</span>
        <span class="stat-value" id="lastFetch">--:--</span>
      </div>
    </div>

    <div class="controls">
      <button id="fetchBtn" onclick="fetchIncidents()">⟳ Fetch Data</button>
      <button class="btn-secondary" onclick="exportJSON()">↓ Export JSON</button>
      <input type="text" id="filterInput" placeholder="Filter by location, road, province..." onkeyup="filterIncidents()">
    </div>

    <div id="loading" class="loading" style="display: none;">
      <div class="spinner"></div>
      <p>Fetching data from DGT API...</p>
    </div>

    <div id="error" style="display: none;"></div>
    <div id="incidents"></div>

    <footer>
      <p>Built with vanilla JS • Data: <a href="https://nap.dgt.es" target="_blank">DGT NAP</a> • 
      <a href="https://github.com/stringmanolo" target="_blank">github.com/stringmanolo</a></p>
    </footer>
  </div>

  <script>
    let incidentsData = [];
    let filteredData = [];

    async function fetchIncidents() {
      const btn = document.getElementById('fetchBtn');
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      const incidents = document.getElementById('incidents');
      const stats = document.getElementById('stats');

      btn.disabled = true;
      loading.style.display = 'block';
      error.style.display = 'none';
      incidents.innerHTML = '';
      stats.style.display = 'none';

      try {
        const apiUrl = 'https://nap.dgt.es/datex2/v3/dgt/SituationPublication/datex2_v36.xml';
        
        const proxies = [
          { url: 'https://api.allorigins.win/raw?url=', name: 'AllOrigins' },
          { url: 'https://api.codetabs.com/v1/proxy?quest=', name: 'CodeTabs' },
          { url: 'https://corsproxy.io/?', name: 'CorsProxy.io' }
        ];

        const fetchPromises = proxies.map(async (proxy) => {
          try {
            const response = await fetch(proxy.url + encodeURIComponent(apiUrl));
            if (!response.ok) return null;
            
            const text = await response.text();
            
            if (!text.includes('<?xml') && !text.includes('<payload')) {
              return null;
            }
            
            return { text, proxy: proxy.name };
          } catch (e) {
            return null;
          }
        });

        let result = null;
        const results = await Promise.all(fetchPromises);
        result = results.find(r => r !== null);

        if (!result) {
          throw new Error('All CORS proxies failed. Try again later.');
        }

        const { text: xmlText, proxy: winnerProxy } = result;
        console.log(`✓ Fastest proxy: ${winnerProxy}`);

        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, 'text/xml');

        const parseError = xmlDoc.querySelector('parsererror');
        if (parseError) {
          throw new Error('XML parsing failed');
        }

        let situations = xmlDoc.getElementsByTagName('sit:situation');
        if (situations.length === 0) {
          situations = xmlDoc.getElementsByTagName('situation');
        }
        console.log(`✓ Found ${situations.length} situation elements`);

        if (situations.length === 0) {
          incidents.innerHTML = `
            <div class="empty-state">
              <h3>✅ No Active Incidents</h3>
              <p>There are currently no traffic incidents reported by DGT.</p>
            </div>
          `;
          return;
        }

        incidentsData = Array.from(situations).map((sit, idx) => parseIncident(sit, idx));
        
        incidentsData.sort((a, b) => {
          const dateA = new Date(a.created || 0);
          const dateB = new Date(b.created || 0);
          return dateB - dateA;
        });

        filteredData = [...incidentsData];
        renderIncidents(filteredData);
        updateStats(incidentsData);
        stats.style.display = 'flex';

      } catch (err) {
        error.style.display = 'block';
        error.innerHTML = `<strong>ERROR:</strong> ${err.message}`;
        console.error('Fetch error:', err);
      } finally {
        loading.style.display = 'none';
        btn.disabled = false;
      }
    }

    function getTagValue(parent, ...tags) {
      for (const tag of tags) {
        const el = parent.getElementsByTagName(tag)[0];
        if (el) return el.textContent.trim();
      }
      return null;
    }

    function getElement(parent, ...tags) {
      for (const tag of tags) {
        const el = parent.getElementsByTagName(tag)[0];
        if (el) return el;
      }
      return null;
    }

    function parseIncident(situation, index) {
      const record = getElement(situation, 'sit:situationRecord', 'situationRecord');
      const location = record ? getElement(record, 'sit:locationReference', 'locationReference') : null;
      
      let coords = null, road = null, province = null, municipality = null, autonomousCommunity = null, kilometerPoint = null;

      if (location) {
        const tpegPoint = getElement(location, 'loc:tpegPointLocation', 'tpegPointLocation');
        const tpegLinear = getElement(location, 'loc:tpegLinearLocation', 'tpegLinearLocation');
        
        const tpeg = tpegPoint || tpegLinear;
        
        if (tpeg) {
          let point = getElement(tpeg, 'loc:point', 'point');
          if (!point) point = getElement(tpeg, 'loc:from', 'from');
          if (!point) point = getElement(tpeg, 'loc:to', 'to');
          
          if (point) {
            const pointCoords = getElement(point, 'loc:pointCoordinates', 'pointCoordinates');
            if (pointCoords) {
              const lat = getTagValue(pointCoords, 'loc:latitude', 'latitude');
              const lon = getTagValue(pointCoords, 'loc:longitude', 'longitude');
              if (lat && lon) coords = { lat, lon };
            }

            const extension = getElement(point, 'loc:_tpegNonJunctionPointExtension', '_tpegNonJunctionPointExtension');
            if (extension) {
              const extPoint = getElement(extension, 'loc:extendedTpegNonJunctionPoint', 'extendedTpegNonJunctionPoint');
              if (extPoint) {
                autonomousCommunity = getTagValue(extPoint, 'lse:autonomousCommunity', 'cse:autonomousCommunity', 'autonomousCommunity');
                province = getTagValue(extPoint, 'lse:province', 'cse:province', 'province');
                municipality = getTagValue(extPoint, 'lse:municipality', 'cse:municipality', 'municipality');
                kilometerPoint = getTagValue(extPoint, 'lse:kilometerPoint', 'cse:kilometerPoint', 'kilometerPoint');
              }
            }
          }
        }

        const suppDesc = getElement(location, 'loc:supplementaryPositionalDescription', 'supplementaryPositionalDescription');
        if (suppDesc) {
          const roadInfo = getElement(suppDesc, 'loc:roadInformation', 'roadInformation');
          if (roadInfo) {
            road = getTagValue(roadInfo, 'loc:roadName', 'roadName');
          }
        }
      }

      const severity = getTagValue(situation, 'sit:overallSeverity', 'overallSeverity') || 'unknown';
      const headerInfo = getElement(situation, 'sit:headerInformation', 'headerInformation');
      const status = headerInfo ? getTagValue(headerInfo, 'com:informationStatus', 'informationStatus') : null;

      const cause = getElement(record, 'sit:cause', 'cause');
      let causeType = null, detailedCause = null;
      if (cause) {
        causeType = getTagValue(cause, 'sit:causeType', 'causeType');
        const detailedCauseEl = getElement(cause, 'sit:detailedCauseType', 'detailedCauseType');
        if (detailedCauseEl) {
          const allTags = Array.from(detailedCauseEl.getElementsByTagName('*'));
          if (allTags.length > 0) {
            detailedCause = allTags[0].textContent.trim();
          }
        }
      }

      const validity = getElement(record, 'sit:validity', 'validity');
      let validityStatus = null, validityStart = null;
      if (validity) {
        validityStatus = getTagValue(validity, 'com:validityStatus', 'validityStatus');
        const timeSpec = getElement(validity, 'com:validityTimeSpecification', 'validityTimeSpecification');
        if (timeSpec) {
          validityStart = getTagValue(timeSpec, 'com:overallStartTime', 'overallStartTime');
        }
      }

      const source = getElement(record, 'sit:source', 'source');
      const sourceId = source ? getTagValue(source, 'com:sourceIdentification', 'sourceIdentification') : null;

      return {
        index: index + 1,
        id: situation.getAttribute('id') || `INC-${index + 1}`,
        severity: severity,
        status: status || 'N/A',
        type: record?.getAttribute('xsi:type') || 'N/A',
        created: getTagValue(record, 'sit:situationRecordCreationTime', 'situationRecordCreationTime'),
        updated: getTagValue(record, 'sit:situationRecordVersionTime', 'situationRecordVersionTime'),
        recordId: record?.getAttribute('id') || 'N/A',
        recordVersion: record?.getAttribute('version') || 'N/A',
        probability: getTagValue(record, 'sit:probabilityOfOccurrence', 'probabilityOfOccurrence') || 'N/A',
        specificSeverity: getTagValue(record, 'sit:severity', 'severity'),
        cause: causeType || 'N/A',
        detailedCause: detailedCause,
        road: road,
        province: province,
        municipality: municipality,
        autonomousCommunity: autonomousCommunity,
        kilometerPoint: kilometerPoint,
        coords: coords,
        direction: getTagValue(location, 'loc:tpegDirection', 'tpegDirection') || getTagValue(location, 'tpegDirection') || 'N/A',
        source: sourceId || 'N/A',
        validityStatus: validityStatus,
        validityStart: validityStart
      };
    }

    function renderIncidents(data) {
      const container = document.getElementById('incidents');
      container.innerHTML = '';

      data.forEach(inc => {
        const severityClass = 
          inc.severity.toLowerCase().includes('high') ? 'severity-high' :
          inc.severity.toLowerCase().includes('medium') ? 'severity-medium' :
          inc.severity.toLowerCase().includes('low') ? 'severity-low' : '';

        const mapLink = inc.coords 
          ? `<a href="https://www.google.com/maps?q=${inc.coords.lat},${inc.coords.lon}" target="_blank" class="map-link">Lat ${inc.coords.lat}, Lon ${inc.coords.lon}</a>`
          : 'N/A';

        let html = `
          <div class="incident">
            <div class="incident-header">--- INCIDENCIA Nº ${inc.index} ---</div>
            <div class="incident-line"><span class="field-label">ID: </span><span class="field-value">${inc.id}</span></div>
        `;

        if (inc.severity && inc.severity !== 'unknown') {
          html += `<div class="incident-line"><span class="field-label">GRAVEDAD GENERAL: </span><span class="field-value ${severityClass}">${inc.severity}</span></div>`;
        }

        html += `<div class="incident-line"><span class="field-label">ESTADO INFORMACIÓN: </span><span class="field-value">${inc.status}</span></div>`;
        html += `<div class="incident-line"><span class="field-label">TIPO REGISTRO: </span><span class="field-value">${inc.type}</span></div>`;
        html += `<div class="incident-line"><span class="field-label">ID REGISTRO: </span><span class="field-value">${inc.recordId} (v${inc.recordVersion})</span></div>`;
        html += `<div class="incident-line"><span class="field-label">CREACIÓN: </span><span class="field-value">${inc.created || 'N/A'}</span></div>`;
        html += `<div class="incident-line"><span class="field-label">ACTUALIZACIÓN: </span><span class="field-value">${inc.updated || 'N/A'}</span></div>`;
        html += `<div class="incident-line"><span class="field-label">PROBABILIDAD: </span><span class="field-value">${inc.probability}</span></div>`;

        if (inc.specificSeverity) {
          html += `<div class="incident-line"><span class="field-label">GRAVEDAD ESPECÍFICA: </span><span class="field-value">${inc.specificSeverity}</span></div>`;
        }

        html += `<div class="incident-line"><span class="field-label">FUENTE: </span><span class="field-value">${inc.source}</span></div>`;

        if (inc.validityStatus) {
          html += `<div class="incident-line"><span class="field-label">ESTADO VALIDEZ: </span><span class="field-value">${inc.validityStatus}</span></div>`;
        }

        if (inc.validityStart) {
          html += `<div class="incident-line"><span class="field-label">INICIO VALIDEZ: </span><span class="field-value">${inc.validityStart}</span></div>`;
        }

        html += `<div class="incident-line"><span class="field-label">CAUSA: </span><span class="field-value">${inc.cause}</span></div>`;

        if (inc.detailedCause) {
          html += `<div class="incident-line"><span class="field-label">CAUSA DETALLADA: </span><span class="field-value">${inc.detailedCause}</span></div>`;
        }

        if (inc.road) {
          html += `<div class="incident-line"><span class="field-label">CARRETERA: </span><span class="field-value">${inc.road}</span></div>`;
        }

        html += `<div class="incident-line"><span class="field-label">DIRECCIÓN: </span><span class="field-value">${inc.direction}</span></div>`;
        html += `<div class="incident-line"><span class="field-label">UBICACIÓN: </span><span class="field-value">${mapLink}</span></div>`;

        if (inc.autonomousCommunity) {
          html += `<div class="incident-line"><span class="field-label">COMUNIDAD: </span><span class="field-value">${inc.autonomousCommunity}</span></div>`;
        }

        if (inc.province) {
          html += `<div class="incident-line"><span class="field-label">PROVINCIA: </span><span class="field-value">${inc.province}</span></div>`;
        }

        if (inc.municipality) {
          html += `<div class="incident-line"><span class="field-label">MUNICIPIO: </span><span class="field-value">${inc.municipality}</span></div>`;
        }

        if (inc.kilometerPoint) {
          html += `<div class="incident-line"><span class="field-label">PUNTO KILOMÉTRICO: </span><span class="field-value">${inc.kilometerPoint}</span></div>`;
        }

        html += `</div>`;
        container.innerHTML += html;
      });
    }

    function formatDate(str) {
      if (!str) return 'N/A';
      return str;
    }

    function updateStats(data) {
      document.getElementById('totalIncidents').textContent = data.length;
      
      const highSev = data.filter(i => 
        i.severity.toLowerCase().includes('high')
      ).length;
      document.getElementById('highSeverity').textContent = highSev;
      
      document.getElementById('lastFetch').textContent = 
        new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    }

    function filterIncidents() {
      const term = document.getElementById('filterInput').value.toLowerCase();
      
      if (!term) {
        filteredData = [...incidentsData];
      } else {
        filteredData = incidentsData.filter(inc => 
          (inc.road && inc.road.toLowerCase().includes(term)) ||
          (inc.province && inc.province.toLowerCase().includes(term)) ||
          (inc.municipality && inc.municipality.toLowerCase().includes(term)) ||
          (inc.autonomousCommunity && inc.autonomousCommunity.toLowerCase().includes(term)) ||
          (inc.cause && inc.cause.toLowerCase().includes(term)) ||
          (inc.type && inc.type.toLowerCase().includes(term)) ||
          (inc.id && inc.id.toLowerCase().includes(term))
        );
      }
      
      renderIncidents(filteredData);
    }

    function exportJSON() {
      if (incidentsData.length === 0) {
        alert('No data to export. Fetch incidents first.');
        return;
      }

      const json = JSON.stringify(incidentsData, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `dgt-incidents-${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    window.onload = () => fetchIncidents();
  </script>
</body>
</html>

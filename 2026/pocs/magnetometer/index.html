<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMF Geiger Scanner</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #161616;
            --text-main: #e0e0e0;
            --accent-blue: #2979ff;
            --accent-red: #ff1744;
            --accent-green: #00e676;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            height: 100vh;
            box-sizing: border-box;
        }

        .dashboard { width: 100%; max-width: 450px; text-align: center; }

        .readout-container {
            background: var(--card-bg);
            padding: 40px 20px;
            border-radius: 20px;
            margin: 20px 0;
            border: 2px solid #333;
            transition: all 0.1s ease;
        }

        .alert-active {
            border-color: var(--accent-red);
            box-shadow: 0 0 30px rgba(255, 23, 68, 0.3);
            background: #200a0a;
        }

        .value { font-size: 4rem; font-weight: bold; font-family: monospace; color: var(--accent-green); }
        .alert-active .value { color: var(--accent-red); }

        #status-text { height: 50px; color: #888; font-size: 0.9rem; margin-bottom: 10px; }

        .controls { background: var(--card-bg); padding: 25px; border-radius: 15px; text-align: left; }
        
        button {
            background: var(--accent-blue); color: white; border: none; padding: 15px; width: 100%;
            border-radius: 10px; font-weight: bold; cursor: pointer; margin-bottom: 20px;
        }

        input[type=range] { width: 100%; accent-color: var(--accent-blue); margin-top: 10px; }

        .label-group { display: flex; justify-content: space-between; font-size: 0.8rem; color: #aaa; }
    </style>
</head>
<body>

    <div class="dashboard">
        <h2 style="letter-spacing: 3px; color: #555;">EMF GEIGER</h2>
        
        <div id="readout-box" class="readout-container">
            <div class="value" id="mag-value">0.00</div>
            <div style="color: #666; font-size: 0.8rem;">MICROTESLAS (μT)</div>
        </div>

        <div id="status-text">Ready. Please calibrate in a clear area.</div>

        <div class="controls">
            <button id="cal-btn" onclick="startCalibration()">START CALIBRATION</button>
            
            <div class="label-group">
                <span>Sensitivity Threshold</span>
                <span id="thresh-display">10 μT</span>
            </div>
            <input type="range" id="sensitivity" min="1" max="300" value="10" oninput="updateThresh(this.value)">

            <div class="label-group" style="margin-top: 20px;">
                <span>Baseline Noise:</span>
                <span id="base-display">0.00 μT</span>
            </div>
        </div>
    </div>

    <script>
        let calibratedBase = 0;
        let isCalibrating = false;
        let tempMax = 0;
        let threshold = 10;
        
        // Audio Context
        let audioCtx = null;
        let oscillator = null;
        let gainNode = null;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            gainNode = audioCtx.createGain();
            gainNode.connect(audioCtx.destination);
            gainNode.gain.value = 0; // Silent by default
            
            oscillator = audioCtx.createOscillator();
            oscillator.type = 'sawtooth';
            oscillator.start();
            oscillator.connect(gainNode);
        }

        function updateThresh(v) {
            threshold = parseInt(v);
            document.getElementById('thresh-display').innerText = v + " μT";
        }

        function startCalibration() {
            initAudio(); // Initialize audio on first interaction
            isCalibrating = true;
            tempMax = 0;
            const btn = document.getElementById('cal-btn');
            btn.disabled = true;
            
            let count = 5;
            const itv = setInterval(() => {
                btn.innerText = `CALIBRATING... ${count}`;
                count--;
                if (count < 0) {
                    clearInterval(itv);
                    calibratedBase = tempMax;
                    document.getElementById('base-display').innerText = calibratedBase.toFixed(2);
                    isCalibrating = false;
                    btn.disabled = false;
                    btn.innerText = "RE-CALIBRATE";
                    document.getElementById('status-text').innerText = "Scanning active. Move near devices.";
                }
            }, 1000);
        }

        if ('Magnetometer' in window) {
            const mag = new Magnetometer({ frequency: 60 });
            const valEl = document.getElementById('mag-value');
            const box = document.getElementById('readout-box');
            const status = document.getElementById('status-text');

            mag.addEventListener('reading', () => {
                const current = Math.sqrt(mag.x**2 + mag.y**2 + mag.z**2);
                valEl.innerText = current.toFixed(2);

                if (isCalibrating) {
                    if (current > tempMax) tempMax = current;
                } else if (calibratedBase > 0) {
                    const diff = Math.abs(current - calibratedBase);
                    
                    if (diff > threshold) {
                        box.classList.add('alert-active');
                        status.innerText = (current > calibratedBase) ? "⚠️ POSITIVE PEAK DETECTED" : "⚠️ NEGATIVE DROP DETECTED";
                        status.style.color = "#ff1744";
                        
                        // Audio Feedback
                        if (gainNode) {
                            // Frequency increases with the magnitude of the detection
                            const freq = 100 + (diff * 5);
                            oscillator.frequency.setTargetAtTime(Math.min(freq, 1500), audioCtx.currentTime, 0.05);
                            gainNode.gain.setTargetAtTime(0.1, audioCtx.currentTime, 0.05);
                        }
                    } else {
                        box.classList.remove('alert-active');
                        if (status.innerText.includes("DETECTED")) {
                            status.innerText = "Scanning...";
                            status.style.color = "#888";
                        }
                        if (gainNode) gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
                    }
                }
            });
            mag.start();
        } else {
            document.getElementById('status-text').innerText = "Magnetometer API not found.";
        }
    </script>
</body>
</html>

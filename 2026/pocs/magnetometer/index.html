<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMF Pro Geiger Scanner</title>
  <style>
    :root {
      --bg: #0a0a0b;
      --card: #16161d;
      --accent: #2979ff;
      --danger: #ff1744;
      --safe: #00e676;
      --text: #e0e0e0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
      height: 100vh;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    .container { width: 100%; max-width: 450px; text-align: center; }

    /* Main Readout */
    .readout {
      background: var(--card);
      padding: 40px 20px;
      border-radius: 24px;
      margin: 20px 0;
      border: 2px solid #222;
      transition: all 0.15s ease;
      position: relative;
    }

    .readout.alert {
      border-color: var(--danger);
      box-shadow: 0 0 40px rgba(255, 23, 68, 0.25);
      background: #1a0a0d;
    }

    .val { font-size: 4.5rem; font-weight: 800; font-family: monospace; color: var(--safe); }
    .alert .val { color: var(--danger); }
    .unit { color: #666; letter-spacing: 2px; font-size: 0.8rem; }

    #status { height: 40px; color: #888; font-size: 0.9rem; margin-bottom: 15px; }

    /* Controls */
    .panel { background: var(--card); padding: 25px; border-radius: 20px; text-align: left; }
    
    button {
      background: var(--accent); color: white; border: none; padding: 18px; width: 100%;
      border-radius: 12px; font-weight: bold; cursor: pointer; margin-bottom: 20px;
      text-transform: uppercase; letter-spacing: 1px;
    }
    button:disabled { background: #333; cursor: wait; }

    .slider-box { margin: 15px 0; }
    .labels { display: flex; justify-content: space-between; font-size: 0.8rem; color: #aaa; margin-bottom: 8px; }
    
    input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }

    /* Modal / Tutorial */
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
      z-index: 100; justify-content: center; align-items: center; padding: 20px;
    }
    .modal-content {
      background: #1c1c22; padding: 30px; border-radius: 20px; max-width: 400px;
      border: 1px solid #333; position: relative;
    }
    .close { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; cursor: pointer; }
    .code { background: #000; padding: 12px; border-radius: 8px; color: var(--safe); font-family: monospace; margin: 10px 0; display: flex; justify-content: space-between; }
    
    .help-btn { background: transparent; border: 1px solid #444; color: #888; margin-top: 10px; font-size: 0.75rem; }
  </style>
</head>
<body>

  <div class="container">
    <h1 style="font-size: 1rem; color: #555; letter-spacing: 4px;">EMF PRO GEIGER</h1>

    <div id="display-box" class="readout">
      <div id="mag-val" class="val">---</div>
      <div class="unit">MICROTESLAS (μT)</div>
    </div>

    <div id="status">Initializing sensors...</div>

    <div class="panel">
      <button id="main-btn" onclick="startCalibration()">Start Calibration</button>
      
      <div class="slider-box">
        <div class="labels">
          <span>Sensitivity Range</span>
          <span id="range-val">10 μT</span>
        </div>
        <input type="range" id="sens-slider" min="1" max="500" value="10" oninput="updateSens(this.value)">
      </div>

      <div class="labels" style="margin-top: 20px; border-top: 1px solid #333; padding-top: 15px;">
        <span>Environment Baseline:</span>
        <span id="base-val">0.00 μT</span>
      </div>
      <button class="help-btn" onclick="showHelp()">Browser Configuration Help</button>
    </div>
  </div>

  <div id="help-modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeHelp()">&times;</span>
      <h2 id="browser-title" style="color: var(--accent);">Setup</h2>
      <div id="help-body"></div>
    </div>
  </div>

  <script>
    let baseline = 0;
    let isCalibrating = false;
    let tempPeak = 0;
    let sensitivity = 10;
    
    // Audio State
    let audioCtx, osc, gain;

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      gain = audioCtx.createGain();
      gain.connect(audioCtx.destination);
      gain.gain.value = 0;
      
      osc = audioCtx.createOscillator();
      osc.type = 'sawtooth';
      osc.start();
      osc.connect(gain);
    }

    function updateSens(v) {
      sensitivity = parseInt(v);
      document.getElementById('range-val').innerText = v + " μT";
    }

    function startCalibration() {
      initAudio();
      isCalibrating = true;
      tempPeak = 0;
      const btn = document.getElementById('main-btn');
      btn.disabled = true;
      
      let count = 5;
      const timer = setInterval(() => {
        btn.innerText = `Calibrating... ${count}s`;
        count--;
        if (count < 0) {
          clearInterval(timer);
          baseline = tempPeak;
          document.getElementById('base-val').innerText = baseline.toFixed(2);
          isCalibrating = false;
          btn.disabled = false;
          btn.innerText = "Re-calibrate";
          document.getElementById('status').innerText = "Scanning for anomalies...";
        }
      }, 1000);
    }

    // Detector Logic
    if ('Magnetometer' in window) {
      const mag = new Magnetometer({ frequency: 60 });
      const valDisplay = document.getElementById('mag-val');
      const box = document.getElementById('display-box');
      const status = document.getElementById('status');

      mag.addEventListener('reading', () => {
        const current = Math.sqrt(mag.x**2 + mag.y**2 + mag.z**2);
        valDisplay.innerText = current.toFixed(2);

        if (isCalibrating) {
          if (current > tempPeak) tempPeak = current;
        } else if (baseline > 0) {
          const diff = Math.abs(current - baseline);
          
          if (diff > sensitivity) {
            box.classList.add('alert');
            status.innerText = current > baseline ? "⚠️ POSITIVE PEAK DETECTED" : "⚠️ NEGATIVE DROP DETECTED";
            status.style.color = "var(--danger)";
            
            if (gain) {
              const freq = 150 + (diff * 4);
              osc.frequency.setTargetAtTime(Math.min(freq, 2000), audioCtx.currentTime, 0.05);
              gain.gain.setTargetAtTime(0.12, audioCtx.currentTime, 0.05);
            }
          } else {
            box.classList.remove('alert');
            if (status.innerText.includes("DETECTED")) {
              status.innerText = "Scanning...";
              status.style.color = "#888";
            }
            if (gain) gain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
          }
        }
      });

      mag.addEventListener('error', () => {
        status.innerText = "Sensor error. Check permissions.";
        showHelp();
      });

      mag.start();
    } else {
      document.getElementById('status').innerText = "API not supported.";
      setTimeout(showHelp, 1500);
    }

    // Browser Detection & Help
    function showHelp() {
      const ua = navigator.userAgent;
      const title = document.getElementById('browser-title');
      const body = document.getElementById('help-body');
      let url = "chrome://flags";

      if (/iPhone|iPad/.test(ua)) {
        title.innerText = "iOS Restriction";
        body.innerHTML = "<p>Apple blocks Magnetometer API. Please use an Android device.</p>";
      } else {
        if (ua.includes("Edg")) url = "edge://flags";
        title.innerText = "Enable Sensor";
        body.innerHTML = `
          <p>1. Copy this address:</p>
          <div class="code"><span>${url}</span></div>
          <p>2. Paste it in your URL bar.</p>
          <p>3. Enable <b>'Generic Sensor Extra Classes'</b>.</p>
          <p>4. Restart your browser.</p>
        `;
      }
      document.getElementById('help-modal').style.display = 'flex';
    }

    function closeHelp() { document.getElementById('help-modal').style.display = 'none'; }
  </script>
</body>
</html>
